name: CI – analytics-audit-service

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ──────────────────────────────────────────────
  # 1. COMPILACIÓN
  # ──────────────────────────────────────────────
  build:
    name: Compilar proyecto
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Dar permisos de ejecución al wrapper de Maven
        run: chmod +x ./mvnw

      - name: Compilar (sin ejecutar tests)
        run: ./mvnw compile -B

      - name: Compilar clases de test
        run: ./mvnw test-compile -B

  # ──────────────────────────────────────────────
  # 2. TESTS
  # ──────────────────────────────────────────────
  test:
    name: Ejecutar tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Dar permisos de ejecución al wrapper de Maven
        run: chmod +x ./mvnw

      - name: Ejecutar todos los tests
        run: ./mvnw test -B

      # ── Tests específicos por funcionalidad ──

      - name: "Test: guardar audit log y retornar DTO"
        if: always()
        run: |
          ./mvnw test -B \
            -Dtest="AuditServiceTest#save_shouldPersistAndReturnDTO" \
            -DfailIfNoTests=false

      - name: "Test: saveInternal persiste sin DTO"
        if: always()
        run: |
          ./mvnw test -B \
            -Dtest="AuditServiceTest#saveInternal_shouldPersist" \
            -DfailIfNoTests=false

      - name: "Test: listar todos los logs"
        if: always()
        run: |
          ./mvnw test -B \
            -Dtest="AuditServiceTest#getAllLogs_shouldReturnMappedList" \
            -DfailIfNoTests=false

      - name: "Test: filtrar logs por entidad"
        if: always()
        run: |
          ./mvnw test -B \
            -Dtest="AuditServiceTest#getLogsByEntityType_shouldFilter" \
            -DfailIfNoTests=false

      - name: "Test: filtrar logs por tipo de evento"
        if: always()
        run: |
          ./mvnw test -B \
            -Dtest="AuditServiceTest#getLogsByEventType_shouldFilter" \
            -DfailIfNoTests=false

      - name: "Test: POST /audit/logs retorna 201"
        if: always()
        run: |
          ./mvnw test -B \
            -Dtest="AuditControllerTest#createLog_shouldReturn201" \
            -DfailIfNoTests=false

      - name: "Test: POST /audit/logs sin eventType retorna 400"
        if: always()
        run: |
          ./mvnw test -B \
            -Dtest="AuditControllerTest#createLog_missingEventType_returns400" \
            -DfailIfNoTests=false

      - name: "Test: GET /audit/logs retorna lista"
        if: always()
        run: |
          ./mvnw test -B \
            -Dtest="AuditControllerTest#getLogs_shouldReturnList" \
            -DfailIfNoTests=false

      - name: "Test: upsert acumula métricas de ventas"
        if: always()
        run: |
          ./mvnw test -B \
            -Dtest="AnalyticsServiceTest#saveSalesMetric_accumulatesWhenExists" \
            -DfailIfNoTests=false

      - name: "Test: payment APPROVED suma ventas"
        if: always()
        run: |
          ./mvnw test -B \
            -Dtest="AnalyticsServiceTest#recordPaymentEvent_approved_accumulatesSales" \
            -DfailIfNoTests=false

      - name: "Test: payment REJECTED no suma ventas"
        if: always()
        run: |
          ./mvnw test -B \
            -Dtest="AnalyticsServiceTest#recordPaymentEvent_rejected_noSales" \
            -DfailIfNoTests=false

      - name: "Test: POST /analytics/sales retorna 201"
        if: always()
        run: |
          ./mvnw test -B \
            -Dtest="AnalyticsControllerTest#createSalesMetric_shouldReturn201" \
            -DfailIfNoTests=false

      - name: "Test: POST /analytics/payments sin eventId retorna 400"
        if: always()
        run: |
          ./mvnw test -B \
            -Dtest="AnalyticsControllerTest#createSalesMetric_missingEventId_returns400" \
            -DfailIfNoTests=false

      - name: Publicar reporte de tests (Surefire)
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          fail_on_failure: true
          require_tests: true

      - name: Subir artefactos de reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  # ──────────────────────────────────────────────
  # 3. DOCKER — solo en merge a main
  # ──────────────────────────────────────────────
  docker:
    name: Build y publicar imagen Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Dar permisos de ejecución al wrapper de Maven
        run: chmod +x ./mvnw

      - name: Build del JAR (sin tests, ya corrieron)
        run: ./mvnw package -DskipTests -B

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/analytics-audit-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max