# ================================================================
# VIVAEVENTOS - Analytics & Audit Service
# ================================================================

server.port=${SERVER_PORT:8087}
server.servlet.context-path=/

spring.application.name=analytics-audit-service

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/vivaeventos_analytics
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# RabbitMQ
# spring.rabbitmq.host=${RABBITMQ_HOST}
# spring.rabbitmq.port=${RABBITMQ_PORT:5672}
# spring.rabbitmq.username=${RABBITMQ_USERNAME}
# spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

info.app.name=VivaEventos - Analytics & Audit Service
info.app.version=1.0.0

# Logs
logging.level.root=INFO
logging.level.co.empresa=DEBUG

# Jackson
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Bogota