# ================================================================
# TEST configuration - H2 in-memory, no RabbitMQ, no Keycloak
# ================================================================

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable RabbitMQ auto-connect in tests
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# Disable security for slice tests (overridden per-test with @WithMockUser)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://test-keycloak/realms/test/protocol/openid-connect/certs

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Bogota
